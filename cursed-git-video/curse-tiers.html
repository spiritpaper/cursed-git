<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curse Tiers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Rubik+Mono+One&family=VT323&display=swap">
<style>
/* Cursed Git series look. A ladder of five curse tiers on the left; cg climbs it.
   The right side is the readout: tier number, name, warnings ignored, and which mode cg is in. */
:root{
  --bg:#0d0b0f; --panel:#16131a; --panel2:#1d1922; --ink:#ece6da; --muted:#8a8290; --rule:#2c2632;
  --ember:#ff4a3d; --rot:#b8cc46; --calm:#6fb7e0; --gold:#f2c14e; --ghost:#5b5462;
  --t0:#6fb7e0; --t1:#f2c14e; --t2:#ff9a3d; --t3:#ff4a3d; --t4:#ff2350;
  --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --term:"VT323", ui-monospace, monospace;
  --display:"Rubik Mono One", "Arial Black", system-ui, sans-serif;
  --heat:0; --tc:var(--t0);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);margin:0}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:22px 36px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.top h1{font:400 clamp(18px,2.4vw,26px) var(--display);margin:0;letter-spacing:.02em}
.top h1 span{color:var(--ember)}
.top p{margin:0;color:var(--muted);font-size:13px}
.box{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:12px;border:1px solid var(--rule);background:var(--bg)}
.stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.controls button,.controls select{font:600 13px var(--mono);color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:7px 11px;cursor:pointer}
.controls button[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.controls .primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.controls .sp{flex:1}
.controls .hint{color:var(--muted);font-size:12px}
button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
html.video,html.video body{overflow:hidden;background:var(--bg)}
html.video .wrap{max-width:none;padding:0;width:100vw;height:100vh}
html.video .top,html.video .controls{display:none}
html.video .box{border:0;border-radius:0;width:100vw;height:100vh;aspect-ratio:auto}

/* ---- scene ---- */
.heat{position:absolute;inset:0;pointer-events:none;transition:opacity 1s;
  background:radial-gradient(ellipse at 30% 10%,rgba(255,35,80,.35),transparent 55%),radial-gradient(ellipse at 90% 90%,rgba(255,74,61,.25),transparent 55%);opacity:var(--heat)}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 3px,rgba(0,0,0,.28) 3px 4px);opacity:0;transition:opacity .4s}
.stage.t4 .scan{opacity:1}
.stage.t4.quake{animation:quake .5s steps(4) 1}
@keyframes quake{0%{transform-origin:0 0}25%{translate:-8px 5px}50%{translate:7px -4px}75%{translate:-4px -6px}100%{translate:0 0}}
.chapter{position:absolute;left:70px;top:44px;display:flex;align-items:baseline;gap:18px}
.chapter .n{font:400 22px var(--display);color:var(--ember)}
.chapter .t{font:400 30px var(--display)}
.ladder{position:absolute;left:70px;top:120px;width:960px;height:720px}
.rail{position:absolute;top:0;bottom:0;width:10px;background:var(--rule);border-radius:5px}
.rail.l{left:0}.rail.r{right:0}
.rung{position:absolute;left:28px;right:28px;height:124px;border-radius:12px;background:var(--panel);border:2px solid var(--rule);
  display:grid;grid-template-columns:150px minmax(0,1fr);align-items:center;gap:22px;padding:0 210px 0 150px;transition:border-color .5s,background .5s,opacity .5s;opacity:.55}
.rung .num{position:absolute;left:26px;top:50%;translate:0 -50%;font:400 56px var(--display);color:var(--muted);transition:color .5s;width:100px;text-align:center}
.rung .name{font:400 26px var(--display);letter-spacing:.02em}
.rung .desc{font:400 19px/1.35 var(--mono);color:var(--muted)}
.rung .ex{font:600 16px var(--mono);color:var(--muted);margin-top:6px;opacity:.85}
.rung .txt{grid-column:1 / span 2;display:flex;flex-direction:column;gap:2px;padding-left:20px}
.rung.lit{opacity:1;border-color:var(--c);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 14%,var(--panel)),var(--panel) 70%)}
.rung.lit .num{color:var(--c)}
.rung.past{opacity:.85;border-color:color-mix(in srgb,var(--c) 45%,var(--rule))}
.rung.past .num{color:color-mix(in srgb,var(--c) 70%,var(--muted))}
.rung.cracked{background-image:linear-gradient(120deg,transparent 45%,rgba(255,35,80,.55) 46%,transparent 47%),linear-gradient(60deg,transparent 62%,rgba(255,35,80,.45) 63%,transparent 64%)}
.marker{position:absolute;left:740px;width:190px;height:124px;display:flex;align-items:center;justify-content:center;font:400 54px var(--term);color:var(--tc);
  transition:top 1.1s cubic-bezier(.65,0,.35,1),color .5s;white-space:pre;text-shadow:0 0 18px color-mix(in srgb,var(--tc) 60%,transparent);z-index:2}
.marker.jump{animation:hop .5s ease-out}
@keyframes hop{30%{scale:1.2}}
.read{position:absolute;left:1080px;top:120px;width:450px;height:720px;display:flex;flex-direction:column;gap:20px}
.big{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:26px 28px;display:flex;flex-direction:column;gap:6px;flex:1;justify-content:center}
.big .k{font:600 15px var(--mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.big .tier{font:400 210px/0.9 var(--display);color:var(--tc);transition:color .5s;font-variant-numeric:tabular-nums}
.big .tname{font:400 34px var(--display);color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.stat{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:18px 22px;display:flex;flex-direction:column;gap:4px}
.stat .k{font:600 13px var(--mono);color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.stat .v{font:400 46px/1 var(--term);white-space:nowrap;color:var(--ink);font-variant-numeric:tabular-nums}
.mode{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:18px 22px;font:400 40px var(--term);color:var(--calm);transition:color .4s}
.mode .p{color:var(--rot)}
.stage.t4 .mode{color:var(--t4)}
@media (prefers-reduced-motion: reduce){.marker{transition:none}.marker.jump,.stage.t4.quake{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Cursed <span>Git</span> · Curse Tiers</h1><p>Use a tier button as a chapter card: it climbs from the tier below and holds.</p></div>
  <div class="box" id="box">
    <div class="stage" id="stage">
      <div class="heat"></div>
      <div class="chapter"><span class="n">cg</span><span class="t">curse tiers</span></div>
      <div class="ladder" id="ladder"><div class="rail l"></div><div class="rail r"></div><div class="marker" id="marker">( ^_^ )</div></div>
      <div class="read">
        <div class="big"><span class="k">Current tier</span><span class="tier" id="tier">0</span><span class="tname" id="tname">Safe</span></div>
        <div class="row">
          <div class="stat"><span class="k">Warnings ignored</span><span class="v" id="ign">0</span></div>
          <div class="stat"><span class="k">Last commit</span><span class="v" id="ago">2m ago</span></div>
        </div>
        <div class="mode" id="mode"><span class="p">$</span> cg --safe</div>
      </div>
      <div class="scan"></div>
    </div>
  </div>
  <div class="controls" id="controls">
    <button class="primary" id="play" type="button">Pause</button>
    <button id="all" type="button">Full climb</button>
    <span class="hint">Chapter card:</span>
    <span class="sp"></span>
    <select id="speed" aria-label="Speed"><option value="0.6">Slow</option><option value="1" selected>Normal</option><option value="1.6">Fast</option></select>
  </div>
</div>

<script>
const TIERS = [
  { name: 'Safe',         desc: 'Mostly personality.',                    ex: 'toxic partner · commit message judge', face: '( ^_^ )', ign: 0,  ago: '2m ago' },
  { name: 'Annoying',     desc: 'Warnings, insults, rejected commits.',   ex: 'random rejection · stupid rules',       face: '( -_- )', ign: 2,  ago: '24m ago' },
  { name: 'Hostile',      desc: 'Deadlines, forced problems.',            ex: 'commit deadline · random pull',          face: '( ¬_¬ )', ign: 5,  ago: '47m ago' },
  { name: 'Dangerous',    desc: 'Decay, sacrifice, forced conflicts.',    ex: 'code decay · commit sacrifice · merge conflicts', face: '( ò_ó )', ign: 9,  ago: '3h ago' },
  { name: 'Catastrophic', desc: 'Only if you truly deserve it.',          ex: 'potentially destructive',                face: '(╬ ò_ó)', ign: 14, ago: '2 days' },
];

/* ---------- shared: video mode, scaling, run tokens ---------- */
const P=new URLSearchParams(location.search), VIDEO=P.has('video');
if(VIDEO)document.documentElement.classList.add('video');
const $=id=>document.getElementById(id);
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches&&!VIDEO;
function fit(){const b=$('box');$('stage').style.transform=`scale(${Math.min(b.clientWidth/1600,b.clientHeight/900)})`;}
new ResizeObserver(fit).observe($('box'));fit();
let RUN=0,SPEED=1,playing=true;
$('speed').onchange=e=>SPEED=+e.target.value;
const wait=(ms,id)=>new Promise(r=>setTimeout(()=>r(id===RUN),REDUCED?Math.min(ms,250):ms/SPEED));

/* ---------- build ladder (tier 4 at the top) ---------- */
const H=124,G=25, rungTop=t=>(4-t)*(H+G)+6;
const rungs=TIERS.map((T,t)=>{
  const r=document.createElement('div');r.className='rung';r.style.top=rungTop(t)+'px';r.style.setProperty('--c',`var(--t${t})`);
  r.innerHTML=`<span class="num">${t}</span><div class="txt"><span class="name">${T.name}</span><span class="desc">${T.desc}</span><span class="ex">${T.ex}</span></div>`;
  $('ladder').append(r);return r;
});
const marker=$('marker');

function countTo(el,to,id){const from=+el.textContent||0;let n=from;const step=()=>{if(id!==RUN)return;if(n<to){n++;el.textContent=n;setTimeout(step,90/SPEED);}};step();}
function show(t,id,instant){
  const T=TIERS[t],root=document.documentElement;
  root.style.setProperty('--tc',`var(--t${t})`);root.style.setProperty('--heat',(t/4).toFixed(2));
  rungs.forEach((r,i)=>{r.classList.toggle('lit',i===t);r.classList.toggle('past',i<t);r.classList.toggle('cracked',t===4&&i>=3);});
  if(instant){marker.style.transition='none';}
  marker.style.top=rungTop(t)+'px';marker.textContent=T.face;
  if(instant){marker.offsetHeight;marker.style.transition='';}
  else{marker.classList.remove('jump');marker.offsetWidth;marker.classList.add('jump');}
  $('tier').textContent=t;$('tname').textContent=T.name;$('ago').textContent=T.ago;
  if(instant)$('ign').textContent=T.ign;else countTo($('ign'),T.ign,id);
  const st=$('stage');st.classList.toggle('t4',t===4);
  $('mode').innerHTML=`<span class="p">$</span> cg ${t===4?'--evil':'--safe'}`;
  if(t===4&&!instant){st.classList.remove('quake');st.offsetWidth;st.classList.add('quake');}
}
async function climb(from,to,id){
  show(from,id,true);
  if(!await wait(1400,id))return false;
  for(let t=from+1;t<=to;t++){show(t,id);if(!await wait(t===to?3600:2200,id))return false;}
  return true;
}

/* ---------- player ---------- */
const want=P.get('tier');
let mode=want!=null&&!isNaN(+want)?Math.max(0,Math.min(4,+want)):'all';
const ctr=$('controls');
TIERS.forEach((T,t)=>{const b=document.createElement('button');b.type='button';b.textContent='Tier '+t;b.dataset.t=t;b.onclick=()=>{mode=t;playing=true;$('play').textContent='Pause';play();};ctr.insertBefore(b,ctr.querySelector('.sp'));});
async function play(){
  const id=++RUN;
  ctr.querySelectorAll('[data-t]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.t===mode));
  $('all').setAttribute('aria-pressed',mode==='all');
  $('ign').textContent='0';
  const ok=mode==='all'?await climb(0,4,id):await climb(Math.max(0,mode-1),mode,id);
  if(!ok||id!==RUN)return;
  if(playing||VIDEO){if(await wait(1200,id))play();}
}
$('all').onclick=()=>{mode='all';playing=true;$('play').textContent='Pause';play();};
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play';if(playing)play();else RUN++;};
(document.fonts?.ready||Promise.resolve()).then(play);
</script>
</body>
</html>
