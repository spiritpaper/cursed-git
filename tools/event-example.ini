# A Cursed GIT event file. Teams run:  cg event join event-example.ini   (or a URL to it)
# Git's config format: quote any value that contains # or ; (those start comments).

[event]
    name = Cursed Hack 2026
    # where teams hand in `cg card --json > team.json` for the leaderboard
    submit = "the #cursed-leaderboard channel"
    contact = "ask the organizers at the front desk"

[cursed]
    # gentle (Juniper) | hackathon (Miranda, goals scaled to the event) | clingy | toxic | psycho
    preset = hackathon
    personality = miranda
    # the event's length (scales the goals) and its shared end time (everyone's clock runs out together)
    eventHours = 24
    eventEnds = 2026-11-01 18:00

    # optional: your own goals (otherwise they're scaled from eventHours)
    # breakupLevel = 6
    # minBossFightsWon = 2
    # minLinesCommitted = 1200
    # toxicThreshold = 10
    # xpMaturity = 1h

    # deathMarch can NOT be set here. Players turn it on themselves, by hand (docs/EVENTS.md).
