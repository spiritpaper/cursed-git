name: release

# Push a tag like v0.1.0 and this builds cg for every platform and publishes a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # a tag that already has a release (re-pushed, or moved by a history rewrite) is skipped:
  # it must never republish an old version to Homebrew, Scoop or the :latest image
  check:
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.check.outputs.new }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "$GITHUB_REF_NAME is already released: skipping"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-latest
    env:
      # a token that can push to spiritpaper/homebrew-tap-cg and spiritpaper/scoop-bucket-cg
      # (without it, the release still happens; only the package managers are skipped)
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./... && go test ./...
      - name: build
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="cg-${tag}-${os}-${arch}"
            bin="cg"; [ "$os" = windows ] && bin="cg.exe"
            mkdir -p "build/$name"
            # -buildvcs stamps the tag, so `cg version` says it
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "build/$name/$bin" ./cmd/cg
            cp README.md LICENSE "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          # .deb and .rpm for Linux (nfpm, packaging/nfpm.yaml)
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
          for arch in amd64 arm64; do
            cp "build/cg-${tag}-linux-${arch}/cg" packaging/cg
            for fmt in deb rpm; do
              VERSION="${tag#v}" ARCH=$arch "$(go env GOPATH)/bin/nfpm" package -f packaging/nfpm.yaml -p $fmt -t dist/
            done
          done
          rm packaging/cg
          (cd dist && sha256sum * > checksums.txt)
          ls -la dist
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Cursed GIT $GITHUB_REF_NAME" --generate-notes
      - name: homebrew and scoop
        if: env.TAP_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          sh tools/package-managers.sh "$GITHUB_REF_NAME" dist/checksums.txt pm
          ruby -c pm/cg.rb
          python3 -m json.tool pm/cg.json > /dev/null
          publish() { # publish <repo> <folder> <file>
            git clone -q "https://x-access-token:${TAP_TOKEN}@github.com/spiritpaper/$1.git" "pm/$1"
            mkdir -p "pm/$1/$2"
            cp "pm/$3" "pm/$1/$2/$3"
            git -C "pm/$1" add -A
            git -C "pm/$1" -c user.name=spiritpaper -c user.email=spiritpaper@users.noreply.github.com \
              commit -qm "cg $GITHUB_REF_NAME" || { echo "$1: already up to date"; return 0; }
            git -C "pm/$1" push -q
          }
          publish homebrew-tap-cg Formula cg.rb
          publish scoop-bucket-cg bucket cg.json

  # the Docker image (and playground): ghcr.io/spiritpaper/cursed-git
  image:
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/spiritpaper/cursed-git:${{ github.ref_name }}
            ghcr.io/spiritpaper/cursed-git:latest
